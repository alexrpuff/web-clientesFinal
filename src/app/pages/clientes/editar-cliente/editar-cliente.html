<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h3 class="mb-0">Editar cliente</h3>
        <p class="text-muted mb-0">Atualize os dados do cliente e de um dos seus endereços.</p>
    </div>
    <a routerLink="/consultar-clientes" class="btn btn-outline-secondary">Voltar para consulta</a>
</div>

@if(mensagemSucesso()) {
    <div class="alert alert-success" role="status">
        <strong>{{ mensagemSucesso() }}</strong>
    </div>
}
@else if(mensagemErro()) {
    <div class="alert alert-danger" role="alert">
        <strong>{{ mensagemErro() }}</strong>
    </div>
}

@if(carregando()) {
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
    </div>
}
@else if(encontrado()) {
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form [formGroup]="formCliente" (ngSubmit)="editarCliente()" novalidate>

                <app-cliente-form [form]="formCliente">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="enderecoSelecionado" class="form-label">Endereço a ser editado:</label>
                            <select id="enderecoSelecionado" class="form-select"
                                [value]="enderecoSelecionado()" (change)="onSelecionarEndereco($event)">
                                @for(endereco of enderecos(); track endereco.id) {
                                    <option [value]="endereco.id">
                                        {{ endereco.logradouro }}, {{ endereco.numero }} - {{ endereco.cidade }}/{{ endereco.uf }}
                                    </option>
                                }
                                <option [value]="novoEndereco">+ Adicionar novo endereço</option>
                            </select>
                        </div>
                    </div>
                </app-cliente-form>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary shadow-sm" [disabled]="enviando()">
                        {{ enviando() ? 'Salvando...' : 'Salvar alterações' }}
                    </button>
                </div>

            </form>
        </div>
    </div>
}
