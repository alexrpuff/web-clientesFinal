<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h3 class="mb-0">Cadastrar cliente</h3>
        <p class="text-muted mb-0">Preencha os dados do cliente e do seu endereço.</p>
    </div>
    <a routerLink="/consultar-clientes" class="btn btn-outline-secondary">Voltar para consulta</a>
</div>

@if(mensagemSucesso()) {
    <div class="alert alert-success" role="status">
        <strong>{{ mensagemSucesso() }}</strong>
    </div>
}
@else if(mensagemErro()) {
    <div class="alert alert-danger" role="alert">
        <strong>{{ mensagemErro() }}</strong>
    </div>
}

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form [formGroup]="formCliente" (ngSubmit)="cadastrarCliente()" novalidate>

            <app-cliente-form [form]="formCliente"/>

            <div class="mt-4">
                <button type="submit" class="btn btn-success shadow-sm" [disabled]="enviando()">
                    {{ enviando() ? 'Cadastrando...' : 'Realizar cadastro' }}
                </button>
            </div>

        </form>
    </div>
</div>
